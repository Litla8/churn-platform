services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: churn_db
    ports: ["3307:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      retries: 20

  api:
    build: .
    environment: &dbenv
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
      MYSQL_DATABASE: churn_db
    ports: ["8000:8000"]
    depends_on:
      mysql: {condition: service_healthy}

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment: *dbenv
    ports: ["8501:8501"]
    depends_on:
      mysql: {condition: service_healthy}

volumes:
  mysql_data:
